---
layout: blog
---
<article class="post">
  <p class="post-meta"><a href="/blog/">Blog</a> <span aria-hidden="true">/</span> <time datetime="{{ page.date | date_to_xmlschema }}">{% include blog-date.html d=page.date lang=page.lang %}</time></p>
  <h1>{{ page.title }}</h1>
  <div class="post-body">
{{ content }}
  </div>
</article>

{%- if page.previous or page.next %}
<nav class="post-nav" aria-label="Other posts">
  {%- if page.next %}
  <a href="{{ page.next.url }}"{% if page.next.lang %} lang="{{ page.next.lang }}"{% endif %}><span>Newer</span>{{ page.next.title }}</a>
  {%- endif %}
  {%- if page.previous %}
  <a href="{{ page.previous.url }}"{% if page.previous.lang %} lang="{{ page.previous.lang }}"{% endif %}><span>Older</span>{{ page.previous.title }}</a>
  {%- endif %}
</nav>
{%- endif %}
